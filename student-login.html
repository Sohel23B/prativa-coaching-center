<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login - Protiva Coaching Center</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: #0b5ed7;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #084298;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      text-decoration: none;
      color: #0b5ed7;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">প্রতিভা কোচিং সেন্টার</div>
    <div class="subtitle">Student Login</div>

    <form id="loginForm">

      <label>মোবাইল নম্বর</label>
      <input
        type="tel"
        id="phone"
        placeholder="মোবাইল নম্বর লিখুন"
        required
      >

      <label>পাসওয়ার্ড</label>
      <input
        type="password"
        id="password"
        placeholder="পাসওয়ার্ড লিখুন"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="back">
      <a href="index.html">← মূল পেজে ফিরে যান</a>
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://blzozhkeyrsnwjegymnp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_47dVxHv7GBIxSaZQ9F1sYg_7As1yWm3";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const phone =
          document.getElementById("phone").value.trim();

        const password =
          document.getElementById("password").value.trim();

        const message =
          document.getElementById("message");

        message.style.color = "#333";
        message.innerText = "Login হচ্ছে...";

        try {

          const { data, error } =
            await supabaseClient
              .from("Students")
              .select("*")
              .eq("Phone", phone)
              .eq("Password", password)
              .maybeSingle();

          if (error) {
            console.error(error);

            message.style.color = "red";
            message.innerText =
              "ডাটাবেজের সাথে সংযোগে সমস্যা হয়েছে।";

            return;
          }

          if (!data) {

            message.style.color = "red";
            message.innerText =
              "মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল।";

            return;
          }

          localStorage.setItem(
            "studentData",
            JSON.stringify(data)
          );

          message.style.color = "green";
          message.innerText =
            "Login সফল হয়েছে!";

          setTimeout(function() {
            window.location.href = "student-dashboard.html";
          }, 1000);

        } catch (err) {

          console.error(err);

          message.style.color = "red";
          message.innerText =
            "কিছু সমস্যা হয়েছে। আবার চেষ্টা করুন।";
        }

      });

  </script>

</body>
</html>
